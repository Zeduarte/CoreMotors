# Configuração do Netlify para uma app Next.js (App Router / SSR).
# O plugin oficial trata das rotas dinâmicas, Server Actions e middleware —
# sem ele, o Netlify serve como estático e devolve 404 nas rotas.

[build]
  command = "npm run build"
  # O runtime do Next.js publica a partir de `.next` (não da raiz do projeto).
  publish = ".next"

  # As variáveis de cada stand (Supabase, R2, domínio…) vêm TODAS do painel do
  # Netlify (Site configuration → Environment variables), nunca daqui: este
  # ficheiro é igual em todos os sites, e o que estivesse aqui passava à frente
  # do painel — um site novo ficava ligado à base de dados de outro stand.
  # Lista e onde encontrar cada uma: src/config/env-vars.json e
  # docs/novo-projeto.md. O build pára se faltar uma obrigatória
  # (scripts/check-env.mjs).

[[plugins]]
  package = "@netlify/plugin-nextjs"
